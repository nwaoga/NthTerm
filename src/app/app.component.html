<main class="app-shell" [class.left-rail-hidden]="!leftRailVisible">
  <app-shell-toolbar
    class="app-shell-toolbar-host"
    (createTerminalRequested)="onCreateTerminal($event)"
    (commandPaletteRequested)="openCommandPalette()"
    (settingsRequested)="openSettings()"
  />

  <button
    type="button"
    class="left-rail-toggle"
    [attr.aria-label]="leftRailVisible ? 'Hide navigation sidebar' : 'Show navigation sidebar'"
    [attr.title]="leftRailVisible ? 'Hide navigation sidebar' : 'Show navigation sidebar'"
    (click)="toggleLeftRailPreference()"
  >
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="3" y="3.5" width="14" height="13" rx="1.8" stroke="currentColor" stroke-width="1.35" />
      <path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.35" />
      @if (leftRailVisible) {
        <path d="m10.7 7.6-2.1 2.4 2.1 2.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
      } @else {
        <path d="m9.1 7.6 2.1 2.4-2.1 2.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
      }
    </svg>
  </button>

  @if (leftRailVisible) {
    <app-left-rail
      class="app-left-rail-host"
      (newSessionRequested)="onNewSessionRequested()"
      (workspaceSelected)="onWorkspaceSelected($event)"
      (workspaceRenameCommitted)="onWorkspaceRenameCommitted($event)"
      (workspaceDeleteRequested)="onWorkspaceDeleteRequested($event)"
    />
  }

  <section
    class="workspace-shell"
    [class.utility-dock-visible]="utilityPanelVisible"
    [class.workspace-shell-dock-resizing]="dockResizeActive"
    [style.--dock-height.px]="utilityPanelHeight"
  >
    <app-workspace-area
      [inspectorPanelVisible]="inspectorPanelVisible"
      (inspectorPanelVisibleChange)="setInspectorPanelPreference($event)"
    />

    @if (utilityPanelVisible) {
      <div
        class="dock-resize-handle"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize workspace dock"
        (mousedown)="startUtilityPanelResize($event)"
      ></div>
      <app-bottom-dock #bottomDock (utilityTabChange)="onUtilityTabChange($event)" (collapseRequested)="setUtilityPanelPreference(false)" />
    } @else {
      <button type="button" class="dock-restore-button" aria-label="Show workspace dock" title="Show workspace dock (Ctrl+J)" (click)="setUtilityPanelPreference(true)">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2.5" y="3" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" />
          <path d="M2.5 9.5h11M6 7l2-2 2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    }

    <app-status-bar />
  </section>

  <app-command-palette />

  <app-settings-modal
    [open]="settingsOpen"
    [utilityPanelVisible]="utilityPanelVisible"
    [newSessionStartMode]="newSessionStartMode"
    [newSessionCustomPath]="newSessionCustomPath"
    [homeDirectory]="homeDirectory"
    [defaultShell]="defaultShell"
    [systemTheme]="systemTheme"
    [defaultTerminalForeground]="defaultTerminalForeground"
    [defaultTerminalBackground]="defaultTerminalBackground"
    [terminalAnsiPalette]="terminalAnsiPalette"
    [shellOptions]="ws.getShellOptions()"
    (closed)="closeSettings()"
    (utilityPanelPreferenceChange)="setUtilityPanelPreference($event)"
    (newSessionStartModeChange)="setNewSessionStartMode($event)"
    (newSessionCustomPathChange)="setNewSessionCustomPath($event)"
    (defaultShellChange)="setDefaultShell($event)"
    (systemThemeChange)="setSystemTheme($event)"
    (defaultTerminalForegroundChange)="setDefaultTerminalForeground($event)"
    (defaultTerminalBackgroundChange)="setDefaultTerminalBackground($event)"
    (terminalAnsiPaletteChange)="setTerminalAnsiPalette($event)"
  />
</main>
