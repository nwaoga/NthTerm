<footer class="status-bar">
  <div class="status-cluster">
    <span class="dot"></span>
    <span>Connected</span>
  </div>
  <div class="status-cluster">
    <span>{{ ws.workspaceName }}</span>
    <span>{{ ws.terminals.length }} terminals</span>
  </div>
  <div class="status-cluster">
    <span>UTF-8</span>
    <span>{{ getLineEndingLabel() }}</span>
    <span>{{ getFocusedShellLabel() }}</span>
  </div>
</footer>
